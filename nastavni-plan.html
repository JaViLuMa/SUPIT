<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Lovro Pavlov ALGEBRA" />
    <meta property="og:description" content="Lovro Pavlog SUPIT." />

    <link
      rel="shortcut icon"
      href="./assets/icons/favicon.ico"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="./styles/styles.css" />
    <link rel="stylesheet" href="./styles/navbar.css" />
    <link rel="stylesheet" href="./styles/curriculum.css" />
    <link rel="stylesheet" href="./styles/dialog.css" />
    <link rel="stylesheet" href="./styles/footer.css" />

    <script src="./scripts/dialog.js" defer></script>
    <script src="./scripts/navbar.js" defer></script>
    <script src="./scripts/curriculum.js" defer></script>
    <script src="./scripts/footer.js" defer></script>

    <title>SUPIT - Projektni zadatak</title>
  </head>

  <body>
    <nav id="navbar" class="navbar"></nav>

    <div class="curriculum">
      <h1 class="curriculum__text">
        Stipendijski natječaj šk.god. 2018./2019.
      </h1>
    </div>

    <div class="main_curriculum">
      <div class="curriculum__search">
        <input
          id="curriculum-search-input"
          class="curriculum__search__input"
          type="text"
          placeholder="Unesite naziv kolegija"
        />
        <ul id="curriculum-list" class="curriculum__search__list"></ul>
      </div>

      <div class="curriculum__table__container">
        <table class="curriculum__table">
          <thead>
            <tr class="curriculum__table__header__row">
              <th
                class="curriculum__table__header curriculum__table--left-align"
              >
                Kolegij
              </th>
              <th class="curriculum__table__header">ECTS</th>
              <th class="curriculum__table__header">Sati</th>
              <th class="curriculum__table__header">Predavanja</th>
              <th class="curriculum__table__header">Vježbe</th>
              <th
                class="curriculum__table__header curriculum__table--left-align"
              >
                Tip
              </th>
              <th
                class="curriculum__table__header curriculum__table__header--delete"
              >
                Obriši
              </th>
            </tr>
          </thead>
          <tbody id="curriculum-table-body"></tbody>
          <tfoot>
            <tr class="curriculum__table__footer__row">
              <td
                class="curriculum__table__datacell curriculum__table--right-align curriculum__table__datacell--bold"
              >
                Ukupno
              </td>
              <td
                class="curriculum__table__datacell curriculum__table__datacell--bold"
                id="ects-total"
              ></td>
              <td
                class="curriculum__table__datacell curriculum__table__datacell--bold"
                id="hours-total"
              ></td>
              <td
                class="curriculum__table__datacell curriculum__table__datacell--bold"
                id="lectures-total"
              ></td>
              <td
                class="curriculum__table__datacell curriculum__table__datacell--bold"
                id="exercises-total"
              ></td>
              <td
                class="curriculum__table__datacell curriculum__table__datacell--bold"
              ></td>
              <td
                class="curriculum__table__datacell curriculum__table__datacell--bold"
              ></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <dialog class="dialog" id="contact-form"></dialog>

    <footer class="footer" id="footer"></footer>
  </body>
</html>
