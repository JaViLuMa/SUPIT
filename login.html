<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Matej Ruzic ALGEBRA" />
    <meta property="og:description" content="Lovro Pavlog SUPIT." />

    <link
      rel="shortcut icon"
      href="./assets/icons/favicon.ico"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="./styles/styles.css" />
    <link rel="stylesheet" href="./styles/navbar.css" />
    <link rel="stylesheet" href="./styles/login-register.css" />
    <link rel="stylesheet" href="./styles/dialog.css" />
    <link rel="stylesheet" href="./styles/footer.css" />

    <script src="./scripts/dialog.js" defer></script>
    <script src="./scripts/navbar.js" defer></script>
    <script src="./scripts/footer.js" defer></script>
    <script src="./scripts/login.js" defer></script>

    <title>SUPIT - Projektni zadatak</title>
  </head>

  <body>
    <nav id="navbar" class="navbar"></nav>

    <div class="login-register__container">
      <h1 class="login-register__title">Prijava korisnika</h1>
      <form onsubmit="handleLogin(event)" class="login-register__form">
        <label class="form__label">
          <p class="form__label--text">Korisnicko ime</p>
          <input class="form__input" type="text" name="username" required />
        </label>
        <label class="form__label">
          <p class="form__label--text">Lozinka</p>
          <input class="form__input" type="password" name="password" required />
        </label>
        <button class="form__button" type="submit">Prijavi se</button>
        <div
          id="form-error"
          class="form__label--text form__label--text_red"
        ></div>
      </form>
      <p class="form__label--text">
        Nemate račun?
        <a class="form__label--text_link" href="registration.html"
          >Registrirajte se ovdje</a
        >.
      </p>
    </div>

    <dialog class="dialog" id="contact-form"></dialog>

    <footer class="footer" id="footer"></footer>
  </body>
</html>
